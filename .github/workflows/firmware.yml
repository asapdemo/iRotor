# iRotor firmware CI (GitHub Actions).
# The asapdemo organisation allows only its own actions, so this workflow uses no `uses:` at all:
# checkout, toolchain download and release upload are plain shell + the preinstalled `gh` CLI.
#   push to a branch / PR  -> build Release (sizes + checksums in the run summary)
#   push of a tag vX.Y.Z   -> build from the clean tag, create (or update) the GitHub release,
#                             attach iRotor-vX.Y.Z.{bin,hex,elf} + SHA256SUMS
#   Run workflow on a tag  -> same as pushing the tag (re-publishes its release)
name: firmware

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create releases and upload their files

env:
  # Same compiler as the local builds (arm-none-eabi-gcc 12.2.1).
  ARM_TOOLCHAIN: arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi
  ARM_TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi.tar.xz

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history + tags for git describe)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config http.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git fetch -q --tags --prune origin "+refs/heads/*:refs/remotes/origin/*" "+${GITHUB_REF}:refs/ci/head"
          git checkout -q --detach "$GITHUB_SHA"
          git config --unset http.extraheader
          git log -1 --oneline --decorate

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build >/dev/null
          mkdir -p ~/toolchain
          curl -fsSL "$ARM_TOOLCHAIN_URL" | tar -xJ -C ~/toolchain
          echo "$HOME/toolchain/$ARM_TOOLCHAIN/bin" >> "$GITHUB_PATH"

      - name: Build Release
        run: |
          set -euo pipefail
          arm-none-eabi-gcc --version | head -1
          cmake --version | head -1
          # Use the committed Core/Src/web_ui_gz.c: regenerating it with another zlib could change
          # the bytes, dirty the tree and turn the version into "...-dirty".
          cmake --preset Release -DCMAKE_DISABLE_FIND_PACKAGE_Python3=TRUE
          cmake --build --preset Release 2>&1 | tee build.log
          if grep -q "warning:" build.log; then
            echo "::warning::the build has compiler warnings"
          fi
          ls -l build/Release/release
          {
            echo '### iRotor build'
            echo '```'
            arm-none-eabi-size build/Release/iRotor.elf
            echo
            cat build/Release/release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the tag build is a clean release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          DESCRIBE="$(git describe --tags --dirty --always --match 'v[0-9]*')"
          if [ "$DESCRIBE" != "$TAG" ]; then
            git status --short
            echo "::error::git describe is '$DESCRIBE', expected '$TAG'"; exit 1
          fi
          test -f "build/Release/release/iRotor-$TAG.bin"
          grep -q "FW_GIT_DESCRIBE \"$TAG\"" build/Release/generated/fw_version.h

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          DIR=build/Release/release

          # Notes: commits since the previous tag + checksums.
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)"
          {
            if [ -n "$PREV" ]; then
              echo "Changes since $PREV:"; echo
              git log --no-merges --pretty='- %s' "$PREV..$TAG"
            else
              git log --no-merges --pretty='- %s' "$TAG"
            fi
            echo
            echo "Flash \`iRotor-$TAG.bin\` from the web UI (Прошивка tab) or \`iRotor-$TAG.hex\` with ST-Link."
            echo
            echo '```'; cat "$DIR/SHA256SUMS"; echo '```'
          } > notes.md

          # Reuse an existing release for this tag (replacing files with the same names), otherwise create it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" "$DIR"/* --clobber
          else
            gh release create "$TAG" "$DIR"/* --title "iRotor $TAG" --notes-file notes.md --verify-tag
          fi
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
